
<section class="signup-section">
  <div class="container">

    <!-- Section Title -->
    <h2 class="section-title">Apply for Membership</h2>
    <p class="subtitle">Connect With Us</p>
    <p class="description">
      Submit your details and chapter preferences. Our local growth coordinator will reach out to secure your guest pass.
    </p>

    <!-- Signup Form -->
    <form class="signup-form">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter your name" />
      </div>

      <div class="form-group">
        <label for="business">Business Name</label>
        <input type="text" id="business" placeholder="Enter your business name" />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" />
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="Enter your 10-digit phone number" />
      </div>

      <div class="form-group">
        <label for="category">Inquiry Category</label>
        <select id="category">
          <option>Join a Chapter (Networking)</option>
          <option>General Inquiry</option>
          <option>Partnership</option>
        </select>
      </div>

      <div class="form-group">
        <label for="description">Brief Business Description</label>
        <textarea id="description" placeholder="Tell us about your industry and what you hope to achieve at BusiHunt..."></textarea>
      </div>

      <button type="submit" class="btn-submit">Send Message</button>
    </form>

  </div>
</section>
